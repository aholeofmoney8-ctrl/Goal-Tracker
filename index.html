<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goal Tracker</title>

  <!-- PWA Manifest Data URI -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Goal%20Tracker%22%2C%22short_name%22%3A%22Goals%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23000000%22%2C%22theme_color%22%3A%22%23000000%22%7D">
  <meta name="theme-color" content="#000000">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Theme Variable Styles & Animations -->
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #111111;
      --card-border: #222222;
      --text-main: #ffffff;
      --text-muted: #888888;
      --accent: #ffffff;
      --accent-hover: #e5e5e5;
    }

    /* Theme Overrides */
    body.theme-pitch-black {
      --bg-color: #000000;
      --card-bg: #111111;
      --card-border: #222222;
      --text-main: #ffffff;
      --text-muted: #888888;
    }
    body.theme-midnight-blue {
      --bg-color: #0B0F19;
      --card-bg: #111827;
      --card-border: #1F2937;
      --text-main: #F9FAFB;
      --text-muted: #9CA3AF;
    }
    body.theme-deep-purple {
      --bg-color: #0F0913;
      --card-bg: #1A1025;
      --card-border: #2A1B3D;
      --text-main: #FDF8FF;
      --text-muted: #A78BFA;
    }
    body.theme-charcoal-gray {
      --bg-color: #121212;
      --card-bg: #1E1E1E;
      --card-border: #2C2C2C;
      --text-main: #EEEEEE;
      --text-muted: #AAAAAA;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .app-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
    }

    .modal-backdrop {
      background-color: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
    }

    /* Smooth transition for view switches */
    .fade-in {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Custom Scrollbar for Logs */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--card-border);
      border-radius: 4px;
    }
  </style>
</head>
<body class="theme-pitch-black min-h-screen flex flex-col justify-between select-none">

  <div id="app" class="max-w-md mx-auto w-full min-h-screen flex flex-col p-4 relative">
    
    <!-- TOP NAVIGATION HEADER -->
    <header class="flex items-center justify-between py-4 mb-2 border-b border-zinc-800/60">
      <button id="btn-settings" aria-label="Settings" class="p-2 rounded-full hover:bg-zinc-800/50 text-zinc-400 hover:text-white transition">
        <i data-lucide="settings" class="w-6 h-6"></i>
      </button>

      <div class="flex items-center gap-2">
        <h1 class="text-xl font-semibold tracking-tight">Goal Tracker</h1>
        <div id="streak-badge" class="flex items-center gap-1 bg-zinc-900 border border-zinc-800 text-xs px-2.5 py-1 rounded-full font-medium text-amber-500">
          <span>🔥</span>
          <span id="streak-count">0</span>
        </div>
      </div>

      <button id="btn-add-goal" aria-label="Add Goal" class="p-2 rounded-full hover:bg-zinc-800/50 text-zinc-400 hover:text-white transition">
        <i data-lucide="square-pen" class="w-6 h-6"></i>
      </button>
    </header>

    <!-- MAIN VIEW CONTAINER -->
    <main class="flex-1 flex flex-col">
      
      <!-- VIEW: DASHBOARD (GOALS LIST) -->
      <section id="view-dashboard" class="fade-in flex-1 flex flex-col">
        <div id="goals-list" class="space-y-3 my-2"></div>
        
        <!-- EMPTY STATE MESSAGE -->
        <div id="empty-state" class="hidden flex-1 flex flex-col items-center justify-center text-center p-8 text-zinc-500 my-auto">
          <div class="p-4 rounded-full bg-zinc-900/50 border border-zinc-800/80 mb-4 text-zinc-400">
            <i data-lucide="target" class="w-10 h-10 stroke-[1.5]"></i>
          </div>
          <p class="text-base font-medium text-zinc-300 mb-1">No goals yet</p>
          <p class="text-xs text-zinc-500 max-w-[200px]">Tap the note icon above to add one!</p>
        </div>
      </section>

      <!-- VIEW: GOAL DETAIL -->
      <section id="view-detail" class="fade-in hidden flex-1 flex flex-col">
        <!-- Detail Header Navigation -->
        <div class="flex items-center justify-between mb-4">
          <button id="btn-detail-back" class="flex items-center gap-1 text-xs text-zinc-400 hover:text-white transition">
            <i data-lucide="chevron-left" class="w-4 h-4"></i> Back
          </button>
          <button id="btn-detail-delete" class="text-xs text-red-500/80 hover:text-red-400 font-medium transition">
            Delete Goal
          </button>
        </div>

        <!-- Goal Header Info -->
        <div class="text-center my-2">
          <h2 id="detail-title" class="text-xl font-semibold tracking-tight mb-1">Goal Title</h2>
          <div class="text-3xl font-extrabold my-2 tracking-tight">
            $<span id="detail-current">0</span> <span class="text-base font-normal text-zinc-500">/ $<span id="detail-target">0</span></span>
          </div>

          <!-- Progress Bar -->
          <div class="w-full bg-zinc-900 border border-zinc-800 rounded-full h-3 my-3 overflow-hidden p-0.5">
            <div id="detail-progress-bar" class="bg-white h-full rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>

          <!-- Completion Estimation Banner -->
          <div id="detail-estimate" class="text-xs text-zinc-400 bg-zinc-900/40 border border-zinc-800/50 rounded-lg p-2.5 my-2">
            Calculating estimated completion date...
          </div>
        </div>

        <!-- Quick Add Step Presets -->
        <div class="my-4">
          <label class="block text-xs text-zinc-500 mb-2 font-medium">QUICK ADD STEP PRESETS</label>
          <div class="grid grid-cols-5 gap-2">
            <button class="btn-step-preset app-card py-2 text-xs font-semibold rounded-lg hover:border-zinc-500 transition text-center" data-step="1">+$1</button>
            <button class="btn-step-preset app-card py-2 text-xs font-semibold rounded-lg hover:border-zinc-500 transition text-center" data-step="5">+$5</button>
            <button class="btn-step-preset app-card py-2 text-xs font-semibold rounded-lg hover:border-zinc-500 transition text-center" data-step="10">+$10</button>
            <button class="btn-step-preset app-card py-2 text-xs font-semibold rounded-lg hover:border-zinc-500 transition text-center" data-step="50">+$50</button>
            <button class="btn-step-preset app-card py-2 text-xs font-semibold rounded-lg hover:border-zinc-500 transition text-center" data-step="100">+$100</button>
          </div>
        </div>

        <!-- Custom Contribution Entry -->
        <div class="app-card p-3 rounded-xl mb-4">
          <label class="block text-xs text-zinc-400 mb-2 font-medium">LOG DEPOSIT / ADJUSTMENT</label>
          <div class="flex gap-2 mb-2">
            <input type="number" id="input-log-amount" placeholder="Amount ($)" class="bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white w-full focus:outline-none focus:border-zinc-600">
            <button id="btn-submit-log" class="bg-white text-black font-semibold text-xs px-4 py-2 rounded-lg hover:bg-zinc-200 transition">Add</button>
          </div>
          <input type="text" id="input-log-note" placeholder="Optional note (e.g. Side hustle, Savings)" class="bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-1.5 text-xs text-white w-full focus:outline-none focus:border-zinc-600">
        </div>

        <!-- Transaction Log History -->
        <div class="flex-1 flex flex-col min-h-[160px]">
          <h3 class="text-xs font-medium text-zinc-500 mb-2">TRANSACTION HISTORY</h3>
          <div id="detail-logs-list" class="flex-1 space-y-2 overflow-y-auto max-h-[180px] pr-1">
            <!-- Dynamic Log Items -->
          </div>
        </div>
      </section>

    </main>
  </div>

  
  <!-- MODAL: ADD GOAL -->
  <div id="modal-add-goal" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50 hidden">
    <div class="app-card w-full max-w-sm rounded-2xl p-5 fade-in shadow-2xl">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-semibold">New Goal</h3>
        <button id="btn-close-add-modal" class="text-zinc-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="form-add-goal" class="space-y-4">
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Goal Title</label>
          <input type="text" id="add-goal-title" required placeholder="e.g. Emergency Fund, Laptop" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-zinc-600">
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Target Amount ($)</label>
          <input type="number" id="add-goal-target" min="1" step="any" required placeholder="1000" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-zinc-600">
        </div>
        <div>
          <label class="block text-xs text-zinc-400 mb-1">Initial Saved Amount ($)</label>
          <input type="number" id="add-goal-initial" min="0" step="any" placeholder="0" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-zinc-600">
        </div>
        <button type="submit" class="w-full bg-white text-black font-semibold text-sm py-2.5 rounded-lg hover:bg-zinc-200 transition mt-2">Create Goal</button>
      </form>
    </div>
  </div>

  <!-- MODAL: SETTINGS -->
  <div id="modal-settings" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50 hidden">
    <div class="app-card w-full max-w-sm rounded-2xl p-5 fade-in shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-semibold">Settings</h3>
        <button id="btn-close-settings-modal" class="text-zinc-500 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <!-- Theme Selection -->
      <div class="mb-6">
        <label class="block text-xs font-medium text-zinc-400 mb-2">COLOR THEME</label>
        <div class="grid grid-cols-2 gap-2 mb-3">
          <button type="button" class="btn-theme-select p-2.5 border rounded-lg text-left text-xs flex items-center justify-between" data-theme="pitch-black">
            <span>Pitch Black</span>
            <span class="w-3 h-3 rounded-full bg-black border border-zinc-700"></span>
          </button>
          <button type="button" class="btn-theme-select p-2.5 border rounded-lg text-left text-xs flex items-center justify-between" data-theme="midnight-blue">
            <span>Midnight Blue</span>
            <span class="w-3 h-3 rounded-full bg-slate-900 border border-slate-700"></span>
          </button>
          <button type="button" class="btn-theme-select p-2.5 border rounded-lg text-left text-xs flex items-center justify-between" data-theme="deep-purple">
            <span>Deep Purple</span>
            <span class="w-3 h-3 rounded-full bg-purple-950 border border-purple-800"></span>
          </button>
          <button type="button" class="btn-theme-select p-2.5 border rounded-lg text-left text-xs flex items-center justify-between" data-theme="charcoal-gray">
            <span>Charcoal Gray</span>
            <span class="w-3 h-3 rounded-full bg-zinc-800 border border-zinc-600"></span>
          </button>
        </div>
        
        <!-- White Confirm Button -->
        <button id="btn-apply-theme" class="w-full bg-white text-black font-semibold text-xs py-2.5 rounded-lg hover:bg-zinc-200 transition shadow-md">
          Apply & Confirm Theme
        </button>
      </div>

      <!-- Backup & Data -->
      <div class="border-t border-zinc-800/80 pt-4 mb-6">
        <label class="block text-xs font-medium text-zinc-400 mb-2">BACKUP & DATA</label>
        <div class="flex gap-2">
          <button id="btn-export-json" class="flex-1 bg-zinc-900 border border-zinc-800 text-xs py-2 rounded-lg hover:bg-zinc-800 transition">Export (JSON)</button>
          <button id="btn-import-trigger" class="flex-1 bg-zinc-900 border border-zinc-800 text-xs py-2 rounded-lg hover:bg-zinc-800 transition">Import (JSON)</button>
          <input type="file" id="input-import-json" accept=".json" class="hidden">
        </div>
      </div>

      <!-- Danger Zone -->
      <div class="border-t border-zinc-800/80 pt-4">
        <label class="block text-xs font-medium text-red-400 mb-2">DANGER ZONE</label>
        <button id="btn-clear-data-trigger" class="w-full bg-red-950/40 border border-red-900/60 text-red-400 text-xs py-2.5 rounded-lg hover:bg-red-900/40 transition">
          Reset All App Data
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL: VERIFICATION / PROMPT -->
  <div id="modal-verify" class="fixed inset-0 modal-backdrop flex items-center justify-center p-4 z-50 hidden">
    <div class="app-card w-full max-w-xs rounded-2xl p-5 fade-in shadow-2xl text-center">
      <h3 id="verify-title" class="text-sm font-semibold mb-1">Security Verification</h3>
      <p id="verify-desc" class="text-xs text-zinc-400 mb-4">Enter '1234' to confirm clearing all data.</p>
      <input type="password" id="input-verify-code" placeholder="PIN Code" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-center text-sm text-white mb-3 focus:outline-none focus:border-zinc-600">
      <div class="flex gap-2">
        <button id="btn-verify-cancel" class="flex-1 bg-zinc-900 text-xs py-2 rounded-lg hover:bg-zinc-800 transition">Cancel</button>
        <button id="btn-verify-confirm" class="flex-1 bg-red-600 text-white text-xs py-2 rounded-lg hover:bg-red-500 transition font-medium">Confirm</button>
      </div>
    </div>
  </div>

  <!-- JAVASCRIPT APP LOGIC -->
  <script>
    
    // STORAGE KEYS
    const STORAGE_KEY = 'minimal_goal_counter_app_v1';

    // INITIAL APP STATE (Completely empty goals by default)
    let appState = {
      goals: [],
      theme: 'pitch-black',
      lastContributionDate: null,
      streak: 0
    };

    let activeGoalId = null;
    let selectedThemeTemp = 'pitch-black';
    let pendingAction = null; // Callback for verification pin modal

    // INLINE SERVICE WORKER FOR PWA OFFLINE CAPABILITY
    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => e.waitUntil(self.clients.claim()));
        self.addEventListener('fetch', (e) => {
          e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
        });
      `;
      const blob = new Blob([swCode], { type: 'application/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    // --- DOM ELEMENTS ---
    const viewDashboard = document.getElementById('view-dashboard');
    const viewDetail = document.getElementById('view-detail');
    const goalsList = document.getElementById('goals-list');
    const emptyState = document.getElementById('empty-state');
    const streakCountEl = document.getElementById('streak-count');

    // Modals
    const modalAddGoal = document.getElementById('modal-add-goal');
    const modalSettings = document.getElementById('modal-settings');
    const modalVerify = document.getElementById('modal-verify');


    // LOAD STATE FROM STORAGE
    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          appState = { ...appState, ...parsed };
        }
      } catch (e) {
        console.error('Error loading state:', e);
      }
      applyTheme(appState.theme || 'pitch-black');
      checkAndUpdateStreak();
      render();
    }

    // SAVE STATE TO STORAGE
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.error('Error saving state:', e);
      }
      render();
    }

    // STREAK MANAGEMENT
    function checkAndUpdateStreak() {
      const today = new Date().toDateString();
      if (!appState.lastContributionDate) {
        appState.streak = 0;
        return;
      }

      const lastDate = new Date(appState.lastContributionDate);
      const currentDate = new Date();
      
      const diffTime = Math.abs(currentDate - lastDate);
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays > 1 && lastDate.toDateString() !== today) {
        // Streak broken
        appState.streak = 0;
      }
    }

    function recordContribution() {
      const today = new Date().toDateString();
      if (appState.lastContributionDate !== today) {
        appState.streak = (appState.streak || 0) + 1;
        appState.lastContributionDate = today;
      }
    }


    // MAIN RENDER CONTROLLER
    function render() {
      lucide.createIcons();
      streakCountEl.textContent = appState.streak || 0;

      if (activeGoalId !== null) {
        viewDashboard.classList.add('hidden');
        viewDetail.classList.remove('hidden');
        renderGoalDetail();
      } else {
        viewDetail.classList.add('hidden');
        viewDashboard.classList.remove('hidden');
        renderDashboard();
      }
    }

    // RENDER DASHBOARD LIST
    function renderDashboard() {
      goalsList.innerHTML = '';

      if (!appState.goals || appState.goals.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      appState.goals.forEach(goal => {
        const percent = Math.min(100, Math.round((goal.current / goal.target) * 100)) || 0;
        const item = document.createElement('div');
        item.className = 'app-card p-4 rounded-xl hover:border-zinc-700 cursor-pointer transition active:scale-[0.99]';
        item.onclick = () => {
          activeGoalId = goal.id;
          render();
        };

        item.innerHTML = `
          <div class="flex items-center justify-between mb-2">
            <span class="font-medium text-sm text-zinc-100">${escapeHtml(goal.title)}</span>
            <span class="text-xs text-zinc-400 font-mono">$${goal.current.toLocaleString()} / $${goal.target.toLocaleString()}</span>
          </div>
          <div class="w-full bg-zinc-900 border border-zinc-800/80 rounded-full h-2 overflow-hidden">
            <div class="bg-white h-full rounded-full transition-all duration-300" style="width: ${percent}%"></div>
          </div>
          <div class="flex justify-between items-center mt-2 text-[10px] text-zinc-500">
            <span>${percent}% completed</span>
            <span>${goal.logs ? goal.logs.length : 0} logs</span>
          </div>
        `;
        goalsList.appendChild(item);
      });
    }

    // RENDER DETAIL VIEW
    function renderGoalDetail() {
      const goal = appState.goals.find(g => g.id === activeGoalId);
      if (!goal) {
        activeGoalId = null;
        render();
        return;
      }

      document.getElementById('detail-title').textContent = goal.title;
      document.getElementById('detail-current').textContent = goal.current.toLocaleString();
      document.getElementById('detail-target').textContent = goal.target.toLocaleString();

      const percent = Math.min(100, Math.round((goal.current / goal.target) * 100)) || 0;
      document.getElementById('detail-progress-bar').style.width = `${percent}%`;

      // Estimate completion date calculation
      calculateTargetEstimate(goal);

      // Render Transaction Logs
      const logsList = document.getElementById('detail-logs-list');
      logsList.innerHTML = '';

      if (!goal.logs || goal.logs.length === 0) {
        logsList.innerHTML = `<p class="text-xs text-zinc-600 italic text-center py-4">No transactions recorded yet.</p>`;
      } else {
        [...goal.logs].reverse().forEach(log => {
          const logEl = document.createElement('div');
          logEl.className = 'flex items-center justify-between p-2.5 rounded-lg bg-zinc-900/60 border border-zinc-800/50 text-xs';
          logEl.innerHTML = `
            <div>
              <p class="text-zinc-200 font-medium">+ $${log.amount.toLocaleString()}</p>
              ${log.note ? `<p class="text-[10px] text-zinc-500">${escapeHtml(log.note)}</p>` : ''}
            </div>
            <span class="text-[10px] text-zinc-500 font-mono">${log.date}</span>
          `;
          logsList.appendChild(logEl);
        });
      }
    }

    // CALCULATE ESTIMATED COMPLETION DATE
    function calculateTargetEstimate(goal) {
      const estimateEl = document.getElementById('detail-estimate');
      const remaining = goal.target - goal.current;

      if (remaining <= 0) {
        estimateEl.innerHTML = `<span class="text-emerald-400 font-medium">🎉 Goal completed! Excellent job!</span>`;
        return;
      }

      if (!goal.logs || goal.logs.length < 2) {
        estimateEl.textContent = `Add more regular deposits to see an estimated completion date.`;
        return;
      }

      // Calculate deposit rate per day based on historical logs
      const sortedLogs = [...goal.logs].sort((a, b) => new Date(a.rawDate || 0) - new Date(b.rawDate || 0));
      const firstLogDate = new Date(sortedLogs[0].rawDate || Date.now());
      const lastLogDate = new Date(sortedLogs[sortedLogs.length - 1].rawDate || Date.now());

      const totalDays = Math.max(1, (lastLogDate - firstLogDate) / (1000 * 60 * 60 * 24));
      const totalSavedInPeriod = sortedLogs.reduce((acc, l) => acc + l.amount, 0);

      const dailyRate = totalSavedInPeriod / totalDays;

      if (dailyRate <= 0) {
        estimateEl.textContent = `Deposit regularly to estimate your finish date.`;
        return;
      }

      const daysNeeded = Math.ceil(remaining / dailyRate);
      const estimatedDate = new Date();
      estimatedDate.setDate(estimatedDate.getDate() + daysNeeded);

      const options = { month: 'short', day: 'numeric', year: 'numeric' };
      estimateEl.innerHTML = `At your current pace (~$${dailyRate.toFixed(1)}/day), you'll reach your goal by <strong class="text-white">${estimatedDate.toLocaleDateString(undefined, options)}</strong> (~${daysNeeded} days).`;
    }


    // LOG DEPOSIT FUNCTION
    function addDeposit(amount, note = '') {
      if (activeGoalId === null || isNaN(amount) || amount <= 0) return;

      const goal = appState.goals.find(g => g.id === activeGoalId);
      if (!goal) return;

      goal.current += amount;
      if (!goal.logs) goal.logs = [];

      const now = new Date();
      const dateStr = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' at ' + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      goal.logs.push({
        id: Date.now(),
        amount: amount,
        note: note.trim(),
        date: dateStr,
        rawDate: now.toISOString()
      });

      recordContribution();
      saveState();
    }


    // STEP PRESET BUTTONS
    document.querySelectorAll('.btn-step-preset').forEach(btn => {
      btn.addEventListener('click', () => {
        const step = parseFloat(btn.dataset.step);
        addDeposit(step, 'Quick Add');
      });
    });

    // CUSTOM LOG SUBMIT
    document.getElementById('btn-submit-log').addEventListener('click', () => {
      const amountInput = document.getElementById('input-log-amount');
      const noteInput = document.getElementById('input-log-note');

      const val = parseFloat(amountInput.value);
      if (val > 0) {
        addDeposit(val, noteInput.value);
        amountInput.value = '';
        noteInput.value = '';
      }
    });

    // BACK TO DASHBOARD
    document.getElementById('btn-detail-back').addEventListener('click', () => {
      activeGoalId = null;
      render();
    });

    // DELETE GOAL
    document.getElementById('btn-detail-delete').addEventListener('click', () => {
      promptVerification("Delete Goal", "Enter '1234' to confirm deleting this goal.", () => {
        appState.goals = appState.goals.filter(g => g.id !== activeGoalId);
        activeGoalId = null;
        saveState();
      });
    });

    // ADD GOAL MODAL CONTROLS
    document.getElementById('btn-add-goal').addEventListener('click', () => {
      modalAddGoal.classList.remove('hidden');
    });
    document.getElementById('btn-close-add-modal').addEventListener('click', () => {
      modalAddGoal.classList.add('hidden');
    });

    document.getElementById('form-add-goal').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('add-goal-title').value.trim();
      const target = parseFloat(document.getElementById('add-goal-target').value);
      const initial = parseFloat(document.getElementById('add-goal-initial').value) || 0;

      if (!title || isNaN(target) || target <= 0) return;

      const newGoal = {
        id: 'goal_' + Date.now(),
        title: title,
        target: target,
        current: initial,
        logs: initial > 0 ? [{
          id: Date.now(),
          amount: initial,
          note: 'Initial balance',
          date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
          rawDate: new Date().toISOString()
        }] : []
      };

      if (!appState.goals) appState.goals = [];
      appState.goals.push(newGoal);
      saveState();

      // Reset Form & Close
      e.target.reset();
      modalAddGoal.classList.add('hidden');
    });


    // SETTINGS MODAL CONTROLS
    document.getElementById('btn-settings').addEventListener('click', () => {
      selectedThemeTemp = appState.theme || 'pitch-black';
      updateThemeSelectUI();
      modalSettings.classList.remove('hidden');
    });
    document.getElementById('btn-close-settings-modal').addEventListener('click', () => {
      modalSettings.classList.add('hidden');
    });

    // THEME SELECTION UI
    function applyTheme(theme) {
      document.body.className = `theme-${theme} min-h-screen flex flex-col justify-between select-none`;
    }

    function updateThemeSelectUI() {
      document.querySelectorAll('.btn-theme-select').forEach(btn => {
        if (btn.dataset.theme === selectedThemeTemp) {
          btn.classList.add('border-white', 'bg-zinc-800/80');
          btn.classList.remove('border-zinc-800');
        } else {
          btn.classList.remove('border-white', 'bg-zinc-800/80');
          btn.classList.add('border-zinc-800');
        }
      });
    }

    document.querySelectorAll('.btn-theme-select').forEach(btn => {
      btn.addEventListener('click', () => {
        selectedThemeTemp = btn.dataset.theme;
        updateThemeSelectUI();
      });
    });

    // APPLY THEME CONFIRM BUTTON
    document.getElementById('btn-apply-theme').addEventListener('click', () => {
      appState.theme = selectedThemeTemp;
      applyTheme(appState.theme);
      saveState();
      modalSettings.classList.add('hidden');
    });

    // EXPORT DATA (JSON)
    document.getElementById('btn-export-json').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appState, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `goal_tracker_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    // IMPORT DATA (JSON)
    document.getElementById('btn-import-trigger').addEventListener('click', () => {
      document.getElementById('input-import-json').click();
    });

    document.getElementById('input-import-json').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported && Array.isArray(imported.goals)) {
            appState = imported;
            saveState();
            modalSettings.classList.add('hidden');
          } else {
            alert('Invalid backup format.');
          }
        } catch (err) {
          alert('Failed to parse backup JSON file.');
        }
      };
      reader.readAsText(file);
    });

    // CLEAR DATA / RESET APP
    document.getElementById('btn-clear-data-trigger').addEventListener('click', () => {
      promptVerification("Reset All App Data", "Enter '1234' to confirm deleting all goals and settings.", () => {
        localStorage.removeItem(STORAGE_KEY);
        appState = {
          goals: [],
          theme: 'pitch-black',
          lastContributionDate: null,
          streak: 0
        };
        activeGoalId = null;
        applyTheme('pitch-black');
        saveState();
        modalSettings.classList.add('hidden');
      });
    });

    // PIN VERIFICATION MODAL LOGIC
    function promptVerification(title, desc, onConfirm) {
      document.getElementById('verify-title').textContent = title;
      document.getElementById('verify-desc').textContent = desc;
      const input = document.getElementById('input-verify-code');
      input.value = '';
      pendingAction = onConfirm;
      modalVerify.classList.remove('hidden');
      input.focus();
    }

    document.getElementById('btn-verify-cancel').addEventListener('click', () => {
      modalVerify.classList.add('hidden');
      pendingAction = null;
    });

    document.getElementById('btn-verify-confirm').addEventListener('click', () => {
      const input = document.getElementById('input-verify-code');
      if (input.value === '1234') {
        modalVerify.classList.add('hidden');
        if (typeof pendingAction === 'function') pendingAction();
        pendingAction = null;
      } else {
        input.classList.add('border-red-500');
        setTimeout(() => input.classList.remove('border-red-500'), 1000);
      }
    });

    // UTILS
    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // INITIALIZATION ON LOAD
    window.addEventListener('DOMContentLoaded', () => {
      loadState();
    });
  </script>
</body>
</html>
